name = "chargeit-lta-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Custom domain on the same Cloudflare zone the WhereIsTheBus proxy uses.
# `wrangler deploy` creates the DNS record + certificate automatically.
# The frontend defaults to this URL; override with the API_BASE repo variable.
routes = [{ pattern = "chargeit-proxy.1313277.xyz", custom_domain = true }]

# Secrets (set in Cloudflare, never committed):
#   npx wrangler secret put LTA_ACCOUNT_KEY
#
# Optional plain var to override the CORS allow-list (comma-separated):
# [vars]
# ALLOWED_ORIGINS = "https://chargeit.wwweeeiii.com,http://localhost:5173"

# Charger history (worker/src/history.ts). Created by .github/workflows/setup-d1.yml;
# migrations are applied by the deploy workflow before each deploy.
[[d1_databases]]
binding = "HISTORY"
database_name = "chargeit-history"
database_id = "5d2a0dec-3c0e-4e57-8401-3d36e2e43e59"
migrations_dir = "migrations"

# Records each LTA snapshot a minute after it's published. A Durable Object
# alarm, not a cron trigger: Workers Free allows only 5 crons per account.
[[durable_objects.bindings]]
name = "CLOCK"
class_name = "HistoryClock"

[[durable_objects.bindings]]
name = "SENDER"
class_name = "PushSender"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HistoryClock"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PushSender"]

[observability]
enabled = true
