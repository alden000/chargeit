name: Test & deploy app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/chargeit-ev-locator-pwa-37iuvu
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (typecheck, unit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: worker
      - run: npm test
      # System packages come from Ubuntu's mirrors, which are sometimes unreachable
      # from runners; the browser itself doesn't need them all (they're mostly fonts),
      # so fall back to installing just the browser rather than failing the deploy.
      - name: Install test browser
        run: |
          timeout 300 npx playwright install --with-deps chromium || {
            echo "::warning::System packages unavailable; installing the browser without them"
            npx playwright install chromium
          }
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 2

  build:
    needs: qa
    # Only main publishes. Other branches still get the full QA run above; the
    # github-pages environment only accepts main, so deploying from a branch
    # would just fail (and email you).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public Worker URL (not a secret). Set the repo variable API_BASE to override.
          VITE_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
